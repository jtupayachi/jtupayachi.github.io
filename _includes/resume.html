<div class="user-details">
  <h1>Resume</h1>
  <p>{{ site.user_description }}</p>
</div>

<!-- Download Button -->
<div style="text-align: center; margin-top: 20px;">
  <a href="latex_resume/main.pdf" download="Resume.pdf">
    <button style="
      padding: 15px 30px; 
      font-size: 18px; 
      background-color: #007BFF; 
      color: white; 
      border: none; 
      border-radius: 5px; 
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: background-color 0.3s ease, transform 0.2s ease;">
      Download PDF
    </button>
  </a>
</div>

<!-- Container for PDF pages -->
<div id="pdf-container" style="
  display: flex; 
  flex-direction: column; 
  align-items: center; 
  margin-bottom: 20px; 
  padding: 10px; 
  max-width: 100%;
  box-sizing: border-box;">
</div>

<!-- Fallback viewer for browsers where pdf.js canvas rendering fails (e.g. Safari) -->
<div id="pdf-fallback" style="display: none; width: 100%; max-width: 900px; margin: 0 auto 20px; box-sizing: border-box;">
  <iframe src="latex_resume/main.pdf" title="Resume PDF" style="width: 100%; height: 1100px; border: none;"></iframe>
  <p style="text-align: center; margin-top: 10px;">
    If the resume does not appear,
    <a href="latex_resume/main.pdf" target="_blank" rel="noopener">open it in a new tab</a>.
  </p>
</div>

<style>
  button {
    padding: 15px 30px;
    font-size: 18px;
    background-color: #007BFF;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    transition: background-color 0.3s ease, transform 0.2s ease;
  }

  button:hover {
    background-color: #0056b3;
    transform: scale(1.05);
  }

  @media (max-width: 768px) {
    button {
      padding: 10px 20px;
      font-size: 16px;
    }

    #pdf-container canvas {
      width: 100% !important;
      height: auto !important;
    }
  }

  @media (max-width: 480px) {
    button {
      padding: 8px 15px;
      font-size: 14px;
    }
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.min.js"></script>

<script>
  (function () {
    var pdfUrl = "latex_resume/main.pdf";

    function showFallback() {
      var container = document.getElementById("pdf-container");
      var fallback = document.getElementById("pdf-fallback");
      if (container) container.style.display = "none";
      if (fallback) fallback.style.display = "block";
    }

    // If pdf.js failed to load (e.g. blocked CDN), show the native fallback.
    if (typeof pdfjsLib === "undefined") {
      showFallback();
      return;
    }

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.worker.min.js";

    // Resize canvas dynamically based on screen width.
    function resizeCanvas(canvas, page) {
      var scale = window.innerWidth < 768 ? 0.75 : 1.5;
      var viewport = page.getViewport({ scale: scale });
      canvas.height = viewport.height;
      canvas.width = viewport.width;
      return { canvasContext: canvas.getContext("2d"), viewport: viewport };
    }

    try {
      var loadingTask = pdfjsLib.getDocument(pdfUrl);
      loadingTask.promise.then(function (pdf) {
        var pdfContainer = document.getElementById("pdf-container");
        for (var pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
          pdf.getPage(pageNumber).then(function (page) {
            var canvas = document.createElement("canvas");
            canvas.style.marginBottom = "20px";
            canvas.style.maxWidth = "100%";
            canvas.style.height = "auto";
            pdfContainer.appendChild(canvas);
            page.render(resizeCanvas(canvas, page));
          });
        }
      }).catch(showFallback);
    } catch (e) {
      showFallback();
    }

    // Safety net: if nothing rendered (silent Safari canvas failure), show fallback.
    setTimeout(function () {
      var container = document.getElementById("pdf-container");
      if (!container || container.querySelectorAll("canvas").length === 0) {
        showFallback();
      }
    }, 3500);
  })();
</script>
